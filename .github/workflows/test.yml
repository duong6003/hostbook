name: test
# Docs-only changes skip the suites: no test reads Markdown or docs/.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS terminal test dependency
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install tmux
      - name: Install using install.sh from this checkout
        env:
          HOSTBOOK_REPO: ${{ github.workspace }}
          SHELL: /bin/bash
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
          bash install.sh
      - name: Verify isolated Unix install and update
        run: bash tests/install.sh
      - name: Run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          for tool in tmux fzf gum; do command -v "$tool" >/dev/null || exit 1; done
          bash tests/test.sh
          bash tests/platform.sh
          python3 -B tests/store-context.py
          bash tests/sync.sh
          bash tests/discovery.sh
          bash tests/hosts-module.sh
          bash tests/settings-module.sh
          bash tests/ui.sh
          bash tests/file-input.sh
          bash tests/menu-empty.sh
          bash tests/controls.sh
          bash tests/open-mode.sh
          bash tests/home-recovery.sh
          bash tests/import.sh
          bash tests/import-keys.sh
          bash tests/import-input.sh
          bash tests/import-package.sh
          bash tests/import-review.sh
          bash tests/import-tui.sh
          bash tests/onboarding.sh
          bash tests/tui.sh
          bash tests/screens.sh
      - name: Test against a real SSH server (Docker, Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash tests/e2e.sh
